[package]
name = "frac_lang_lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frac_lang_lsp"
path = "src/main.rs"

[dependencies]
frac_lang = { path = ".." }
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
